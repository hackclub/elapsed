name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  WORKING_DIR: ${{ github.workspace }}
  GLOBAL_JSON_PATH: '${{ github.workspace }}\global.json'
  SOLUTION_PATH: '${{ github.workspace }}\Elapsed.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\platforms\Riverside.Elapsed.App\Riverside.Elapsed.App.csproj'
  CLI_PROJECT_PATH: '${{ github.workspace }}\src\platforms\Riverside.Elapsed.CommandLine\Riverside.Elapsed.CommandLine.csproj'
  API_PROJECT_PATH: '${{ github.workspace }}\src\core\Riverside.Elapsed\Riverside.Elapsed.csproj'
  TUS_PROJECT_PATH: '${{ github.workspace }}\src\core\Riverside.ResumableUploads\Riverside.ResumableUploads.csproj'
  MEDIA_PROJECT_PATH: '${{ github.workspace }}\src\core\Riverside.MediaRecording\Riverside.MediaRecording.csproj'

jobs:
  evaluate:
    runs-on: windows-2025-vs2026
    outputs:
      version_bumped: ${{ steps.detect.outputs.version_props_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect versioning bump
        id: detect
        shell: pwsh
        run: |
          $before = "${{ github.event.before }}"
          $after  = "${{ github.sha }}"

          if ($before -match '^0+$') {
            $changed = git show --name-only --pretty="" $after | Select-String -SimpleMatch "eng/CurrentVersion.props"
          } else {
            $changed = git diff --name-only $before $after | Select-String -SimpleMatch "eng/CurrentVersion.props"
          }

          $flag = if ($changed) { "true" } else { "false" }
          "version_props_changed=$flag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  formatting:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Install XAML Styler
        run: 'dotnet tool install --global XamlStyler.Console'

      - name: Check XAML formatting
        id: check-step
        run: |
          $changedFiles = (git diff --diff-filter=d --name-only HEAD~1) -split "\n" | Where-Object {$_ -like "*.xaml"}
          foreach ($file in $changedFiles)
          {
            xstyler -p -l None -f $file --indent-tabs true --comment-spaces 1
            if ($LASTEXITCODE -ne 0)
            {
              echo "::error file=$file::Format check failed"
            }
          }
        continue-on-error: true

      - name: Fail if necessary
        if: steps.check-step.outcome == 'failure'
        run: exit 1

  app:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        project: [App]
        targetFramework: [net10.0-desktop, net10.0-android, net10.0-ios]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TFM: ${{ matrix.targetFramework }}
      ID: runtime.any.${{ matrix.project }}.${{ matrix.targetFramework }}.Environment-${{ matrix.configuration }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Dependencies
        uses: "./.github/install_dependencies"
        with:
          target-platform: ${{ matrix.targetFramework }}
          dotnet-version: 10.0.102
          global-json-file: ${{ env.GLOBAL_JSON_PATH }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore .NET workloads
        shell: pwsh
        run: |
          dotnet workload restore $env:APP_PROJECT_PATH

      - name: Restore
        run: |
          msbuild $env:SOLUTION_PATH `
            -t:Restore `
            -p:Configuration=$env:CONFIGURATION

      - name: Build
        if: contains(matrix.targetFramework, 'ios')
        run: |
          msbuild $env:APP_PROJECT_PATH `
            -t:Build `
            -p:Configuration=$env:CONFIGURATION `
            -p:TargetFramework=$env:TFM

      - name: Build & publish
        if: contains(matrix.targetFramework, 'ios') == false
        run: |
          msbuild $env:APP_PROJECT_PATH `
            -t:Publish `
            -p:Configuration=$env:CONFIGURATION `
            -p:TargetFramework=$env:TFM

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: '${{ env.ID }}'
          path: '${{ github.workspace }}\bin\Riverside.Elapsed.App\AnyCPU\${{ env.CONFIGURATION }}\${{ env.TFM }}'

  cli:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: true
      matrix:
        configuration: [Debug, Release]
        project: [CommandLine]
        targetFramework: [net10.0]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TFM: ${{ matrix.targetFramework }}
      ID: runtime.any.${{ matrix.project }}.${{ matrix.targetFramework }}.Environment-${{ matrix.configuration }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Dependencies
        uses: "./.github/install_dependencies"
        with:
          dotnet-version: 10.0.102
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore .NET workloads
        shell: pwsh
        run: dotnet workload restore $env:APP_PROJECT_PATH

      - name: Restore
        run: |
          msbuild $env:SOLUTION_PATH `
            -t:Restore `
            -p:Configuration=$env:CONFIGURATION

      - name: Build & publish
        run: |
          msbuild $env:CLI_PROJECT_PATH `
            -t:Publish `
            -p:Configuration=$env:CONFIGURATION `
            -p:TargetFramework=$env:TFM

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: '${{ env.ID }}'
          path: '${{ github.workspace }}\bin\Riverside.Elapsed.CommandLine\AnyCPU\${{ env.CONFIGURATION }}\${{ env.TFM }}'

  api:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: true
      matrix:
        configuration: [Debug, Release]
        project: [Elapsed]
        targetFramework: [netstandard2.1]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TFM: ${{ matrix.targetFramework }}
      ID: runtime.any.${{ matrix.project }}.${{ matrix.targetFramework }}.Environment-${{ matrix.configuration }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Dependencies
        uses: "./.github/install_dependencies"
        with:
          dotnet-version: 10.0.102
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore .NET workloads
        shell: pwsh
        run: dotnet workload restore $env:APP_PROJECT_PATH

      - name: Restore
        run: |
          msbuild $env:SOLUTION_PATH `
            -t:Restore `
            -p:Configuration=$env:CONFIGURATION

      - name: Build & publish
        run: |
          msbuild $env:API_PROJECT_PATH `
            -t:Publish `
            -p:Configuration=$env:CONFIGURATION `
            -p:TargetFramework=$env:TFM

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: '${{ env.ID }}'
          path: '${{ github.workspace }}\bin\Riverside.Elapsed\AnyCPU\${{ env.CONFIGURATION }}\${{ env.TFM }}'

  tus:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: true
      matrix:
        configuration: [Debug, Release]
        project: [ResumableUploads]
        targetFramework: [netstandard2.1]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TFM: ${{ matrix.targetFramework }}
      ID: runtime.any.${{ matrix.project }}.${{ matrix.targetFramework }}.Environment-${{ matrix.configuration }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Dependencies
        uses: "./.github/install_dependencies"
        with:
          dotnet-version: 10.0.102
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore
        run: |
          msbuild $env:SOLUTION_PATH `
            -t:Restore `
            -p:Configuration=$env:CONFIGURATION

      - name: Build & publish
        run: |
          msbuild $env:TUS_PROJECT_PATH `
            -t:Publish `
            -p:Configuration=$env:CONFIGURATION `
            -p:TargetFramework=$env:TFM

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: '${{ env.ID }}'
          path: '${{ github.workspace }}\bin\Riverside.ResumableUploads\AnyCPU\${{ env.CONFIGURATION }}\${{ env.TFM }}'

  media:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: true
      matrix:
        configuration: [Debug, Release]
        project: [MediaRecording]
        targetFramework: [net10.0]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TFM: ${{ matrix.targetFramework }}
      ID: runtime.any.${{ matrix.project }}.${{ matrix.targetFramework }}.Environment-${{ matrix.configuration }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Dependencies
        uses: "./.github/install_dependencies"
        with:
          dotnet-version: 10.0.102
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore
        run: |
          msbuild $env:SOLUTION_PATH `
            -t:Restore `
            -p:Configuration=$env:CONFIGURATION

      - name: Build & publish
        run: |
          msbuild $env:MEDIA_PROJECT_PATH `
            -t:Publish `
            -p:Configuration=$env:CONFIGURATION `
            -p:TargetFramework=$env:TFM

      - name: Pack library
        run: |
          msbuild $env:MEDIA_PROJECT_PATH `
            -t:Pack `
            -p:Configuration=$env:CONFIGURATION `
            -p:TargetFramework=$env:TFM

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: '${{ env.ID }}'
          path: '${{ github.workspace }}\bin\Riverside.MediaRecording\AnyCPU\${{ env.CONFIGURATION }}\${{ env.TFM }}'

  publish-releases:
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.evaluate.outputs.version_bumped == 'true'
    needs: [evaluate, app, cli, api, tus, media]
    runs-on: windows-latest
    environment:
      name: GitHub Releases

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          skip-decompress: true

      - name: Determine release version
        id: mode
        shell: pwsh
        run: |
          $versionPropsPath = Join-Path $env:GITHUB_WORKSPACE 'eng\CurrentVersion.props'

          [xml]$versionProps = Get-Content $versionPropsPath
          $majorVersion = $versionProps.Project.PropertyGroup.MajorVersion
          $minorVersion = $versionProps.Project.PropertyGroup.MinorVersion
          $releaseLevel = $versionProps.Project.PropertyGroup.ReleaseLevel
          $betaVersion = $versionProps.Project.PropertyGroup.BetaVersion
          $buildDate = Get-Date -Format 'yyMMdd'

          if ($releaseLevel -eq "final") {
            $tag = "v$majorVersion.$minorVersion.$buildDate"
            $prerelease = "false"
            $release_name = "$majorVersion.$minorVersion"
          }
          else {
            $tag = "v$majorVersion.$minorVersion.$buildDate-$releaseLevel$betaVersion"
            $prerelease = "true"
            $release_name = "$majorVersion.$minorVersion-$releaseLevel$betaVersion"
          }

          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "make_latest=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "channel=release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_name=$release_name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mode.outputs.tag }}
          name: ${{ steps.mode.outputs.release_name }}
          draft: true
          make_latest: ${{ steps.mode.outputs.make_latest }}
          token: ${{ secrets.USER_TOKEN }}
          prerelease: ${{ steps.mode.outputs.prerelease }}
          files: |
            runtime.*.Environment-Release\runtime.*.Environment-Release*

  publish-nuget:
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.evaluate.outputs.version_bumped == 'true'
    needs: [evaluate, cli, api, tus, media]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        product: [CommandLine, ResumableUploads, MediaRecording, Elapsed]
    environment:
      name: NuGet
    env:
      PRODUCT: ${{ matrix.product }}
      ID_CLI: runtime.any.CommandLine.net10.0.Environment-Release
      ID_TUS: runtime.any.ResumableUploads.netstandard2.1.Environment-Release
      ID_MEDIA: runtime.any.MediaRecording.net10.0.Environment-Release
      ID_API: runtime.any.Elapsed.netstandard2.1.Environment-Release
    permissions:
      id-token: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate with NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Publish release to NuGet
        id: nuget_release
        shell: pwsh
        run: |
          if ($env:PRODUCT -eq "CommandLine") {
            $artifact=".\${{ env.ID_CLI }}\*.nupkg"
          }
          elseif ($env:PRODUCT -eq "ResumableUploads") {
            $artifact=".\${{ env.ID_TUS }}\*.nupkg"
          }
          elseif ($env:PRODUCT -eq "MediaRecording") {
            $artifact=".\${{ env.ID_MEDIA }}\*.nupkg"
          }
          else {
            $artifact=".\${{ env.ID_API }}\*.nupkg"
          }
          dotnet nuget push $artifact --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  publish-web:
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.evaluate.outputs.version_bumped == 'true'
    needs: [evaluate, app]
    runs-on: windows-latest
    environment:
      name: Web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ID: runtime.any.App.net10.0-browserwasm.Environment-Release

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ID }}
          path: ${{ github.workspace }}\elapsed

      - name: Publish release to web
        shell: pwsh
        run: |
          cd ".\elapsed"
          vercel pull --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --yes --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

